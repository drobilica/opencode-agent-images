version: 2
updates:
  - package-ecosystem: docker
    directory: /opencode-v1-golang-dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      image-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /opencode-v2-golang-dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      image-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /codex-generic-dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      image-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
