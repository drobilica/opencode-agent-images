name: Update OpenCode

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-opencode
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update OpenCode pin
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/update-opencode.sh
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/update-opencode"
          version="$(sed -nE 's/^ARG OPENCODE_VERSION=([^[:space:]]+)$/\1/p' golang/Dockerfile)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add golang/Dockerfile README.md
          git commit -m "chore: update OpenCode to v${version}"
          git push --force-with-lease origin "HEAD:${branch}"
          if ! gh pr list --head "$branch" --state open --json url --jq '.[0].url' | grep -q .; then
            gh pr create --base main --head "$branch" --title "chore: update OpenCode to v${version}" --body "Updates the OpenCode version and verified Linux asset checksums."
          fi
