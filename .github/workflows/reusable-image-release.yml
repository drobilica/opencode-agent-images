name: Reusable image validation and release

on:
  workflow_call:
    inputs:
      family:
        required: true
        type: string
      expected_sha:
        required: false
        type: string
        default: ""
      release_tag:
        required: false
        type: string
        default: ""

jobs:
  validate:
    name: Validate ${{ matrix.platform }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Verify dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "${GITHUB_SHA}" = "${EXPECTED_SHA}"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha != '' && inputs.expected_sha || github.sha }}
          fetch-depth: 0

      - name: Read and validate image metadata
        id: image
        env:
          FAMILY: ${{ inputs.family }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash .github/scripts/image-metadata.sh "${FAMILY}" "${TAG_NAME}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build runtime-testable candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: local/${{ inputs.family }}:${{ matrix.arch }}-${{ github.sha }}
          build-args: |
            IMAGE_VERSION=${{ steps.image.outputs.agent_version }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.family }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.family }}-${{ matrix.arch }}

      - name: Smoke test candidate
        env:
          FAMILY: ${{ inputs.family }}
          IMAGE: local/${{ inputs.family }}:${{ matrix.arch }}-${{ github.sha }}
          VERSION: ${{ steps.image.outputs.agent_version }}
          PLATFORM: ${{ matrix.platform }}
        run: bash .github/scripts/smoke-test.sh "${FAMILY}" "${IMAGE}" "${VERSION}" "${PLATFORM}" "${GITHUB_SHA}"

      - name: Scan candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/${{ inputs.family }}:${{ matrix.arch }}-${{ github.sha }}
          format: json
          output: trivy-${{ matrix.arch }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Publish Trivy summary
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "trivy-${ARCH}.json")"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "trivy-${ARCH}.json")"
          printf '### Trivy — %s\n\n- CRITICAL: %s\n- HIGH: %s\n' "${ARCH}" "${critical}" "${high}" >>"${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish, attest, sign, and release
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read and validate release metadata
        id: image
        env:
          FAMILY: ${{ inputs.family }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag_name="${INPUT_TAG:-${REF_NAME}}"
          bash .github/scripts/image-metadata.sh "${FAMILY}" "${tag_name}"
          revision="$(git rev-parse "refs/tags/${tag_name}^{commit}")"
          echo "tag_name=${tag_name}" >>"${GITHUB_OUTPUT}"
          echo "revision=${revision}" >>"${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Inspect immutable exact-version tag
        id: existing
        env:
          PACKAGE: ${{ steps.image.outputs.package }}
          REVISION: ${{ steps.image.outputs.revision }}
          VERSION: ${{ steps.image.outputs.agent_version }}
        run: |
          if docker buildx imagetools inspect "${PACKAGE}:${VERSION}" >/dev/null 2>&1; then
            digest="$(docker buildx imagetools inspect "${PACKAGE}:${VERSION}" | sed -n 's/^Digest:[[:space:]]*//p')"
            docker pull --platform linux/amd64 "${PACKAGE}@${digest}"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${PACKAGE}@${digest}")"
            image_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${PACKAGE}@${digest}")"
            test "${revision}" = "${REVISION}"
            test "${image_version}" = "${VERSION}"
            echo "Reusing exact tag from this commit without mutating it: ${PACKAGE}@${digest}"
            echo "exists=true" >>"${GITHUB_OUTPUT}"
            echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Build and publish multi-platform image
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.package }}:${{ steps.image.outputs.agent_version }}
            ${{ steps.image.outputs.package }}:latest
          annotations: |
            index:org.opencontainers.image.title=${{ steps.image.outputs.title }}
            index:org.opencontainers.image.description=${{ steps.image.outputs.description }}
            index:org.opencontainers.image.version=${{ steps.image.outputs.agent_version }}
            index:org.opencontainers.image.source=https://github.com/drobilica/opencode-agent-images
            index:org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            index:org.opencontainers.image.documentation=https://github.com/drobilica/opencode-agent-images/tree/main/${{ inputs.family }}
            index:org.opencontainers.image.licenses=MIT
          build-args: |
            IMAGE_VERSION=${{ steps.image.outputs.agent_version }}
            IMAGE_REVISION=${{ steps.image.outputs.revision }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ inputs.family }}-release
          cache-to: type=gha,mode=max,scope=${{ inputs.family }}-release

      - name: Resolve released digest and reconcile latest
        id: release
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PACKAGE: ${{ steps.image.outputs.package }}
        run: |
          digest="${EXISTING_DIGEST:-${BUILT_DIGEST}}"
          test "${digest}" != ""
          if [[ -n "${EXISTING_DIGEST}" ]]; then
            docker buildx imagetools create --tag "${PACKAGE}:latest" "${PACKAGE}@${digest}"
          fi
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: Verify tags and released runtime
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          FAMILY: ${{ inputs.family }}
          PACKAGE: ${{ steps.image.outputs.package }}
          REVISION: ${{ steps.image.outputs.revision }}
          TITLE: ${{ steps.image.outputs.title }}
          VERSION: ${{ steps.image.outputs.agent_version }}
        run: |
          exact_digest="$(docker buildx imagetools inspect "${PACKAGE}:${VERSION}" | sed -n 's/^Digest:[[:space:]]*//p')"
          latest_digest="$(docker buildx imagetools inspect "${PACKAGE}:latest" | sed -n 's/^Digest:[[:space:]]*//p')"
          test "${exact_digest}" = "${DIGEST}"
          test "${latest_digest}" = "${DIGEST}"
          index="$(docker buildx imagetools inspect --raw "${PACKAGE}@${DIGEST}")"
          jq -e \
            --arg title "${TITLE}" \
            --arg version "${VERSION}" \
            --arg revision "${REVISION}" \
            --arg documentation "https://github.com/drobilica/opencode-agent-images/tree/main/${FAMILY}" \
            '.annotations["org.opencontainers.image.title"] == $title
             and .annotations["org.opencontainers.image.version"] == $version
             and .annotations["org.opencontainers.image.source"] == "https://github.com/drobilica/opencode-agent-images"
             and .annotations["org.opencontainers.image.revision"] == $revision
             and .annotations["org.opencontainers.image.documentation"] == $documentation
             and .annotations["org.opencontainers.image.licenses"] == "MIT"' <<<"${index}"
          docker pull --platform linux/amd64 "${PACKAGE}@${DIGEST}"
          bash .github/scripts/smoke-test.sh "${FAMILY}" "${PACKAGE}@${DIGEST}" "${VERSION}" linux/amd64 "${REVISION}"

      - name: Verify BuildKit attestations
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          PACKAGE: ${{ steps.image.outputs.package }}
        run: bash .github/scripts/verify-attestations.sh "${PACKAGE}@${DIGEST}"

      - name: Scan released digest with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.package }}@${{ steps.release.outputs.digest }}
          format: json
          output: trivy-release.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify immutable digest
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/reusable-image-release.yml@${{ github.ref }}
          PACKAGE: ${{ steps.image.outputs.package }}
        run: |
          cosign sign --yes "${PACKAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${PACKAGE}@${DIGEST}"

      - name: Generate rich release notes
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          FAMILY: ${{ inputs.family }}
          SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/reusable-image-release.yml@${{ github.ref }}
        run: bash .github/scripts/release-notes.sh "${FAMILY}" "${DIGEST}" trivy-release.json release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.image.outputs.prerelease }}
          TAG_NAME: ${{ steps.image.outputs.tag_name }}
          TITLE: ${{ steps.image.outputs.title }} ${{ steps.image.outputs.agent_version }}
        run: |
          args=(--title "${TITLE}" --notes-file release-notes.md)
          [[ "${PRERELEASE}" == true ]] && args+=(--prerelease)
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" "${args[@]}"
          else
            gh release create "${TAG_NAME}" --verify-tag "${args[@]}"
          fi

      - name: Publish release summary
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          PACKAGE: ${{ steps.image.outputs.package }}
          VERSION: ${{ steps.image.outputs.agent_version }}
        run: |
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-release.json)"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-release.json)"
          # shellcheck disable=SC2016
          printf '## Released `%s:%s`\n\n- Digest: `%s`\n- `latest`: `%s`\n- Trivy CRITICAL: %s\n- Trivy HIGH: %s\n- SBOM/provenance: verified\n- Cosign signature: verified\n' \
            "${PACKAGE}" "${VERSION}" "${DIGEST}" "${DIGEST}" "${critical}" "${high}" >>"${GITHUB_STEP_SUMMARY}"
